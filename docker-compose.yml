services:
  app:
    build: .
    environment:
      PREG_TIMEZONE: ${PREG_TIMEZONE:-Asia/Shanghai}
      PREG_PUBLIC_DOMAIN: ${PREG_PUBLIC_DOMAIN:-localhost}
      PREG_SHARE_TOKEN_TTL_DAYS: ${PREG_SHARE_TOKEN_TTL_DAYS:-30}
      PREG_BACKUP_RETENTION_DAYS: ${PREG_BACKUP_RETENTION_DAYS:-30}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  proxy:
    image: caddy:2-alpine
    profiles: ["https"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      PREG_PUBLIC_DOMAIN: ${PREG_PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
